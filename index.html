<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personality Quiz</title>
    <link rel="icon" type="image/x-icon" href="/img/ideas.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href ="./css/style.css">
</head>
<body>
    <h1 class="text-center mt-4">What Type of Gamer Are You?</h1>
    
    <!-- Start quiz element -->
    <div class="container d-flex justify-content-center" id="question-1">
      <div class="card my-4 p-4 question-block" style="width: 75%;">
        <h4 class="mb-3">1. What do you enjoy most in a game?</h4>
        <div class="row g-2">
          <div class="col-6">
            <button class="btn btn-outline-primary w-100 answer-btn" data-answer="competitive">Scoring points and winning</button>
          </div>
          <div class="col-6">
            <button class="btn btn-outline-primary w-100 answer-btn" data-answer="casual">Exploring and building things</button>
          </div>
          <div class="col-6">
            <button class="btn btn-outline-primary w-100 answer-btn" data-answer="competitive">Competing against friends</button>
          </div>
          <div class="col-6">
            <button class="btn btn-outline-primary w-100 answer-btn" data-answer="casual">Relaxing and having fun</button>
          </div>
        </div>
      </div>
    </div>

    
    
    <!-- End quiz element -->

    <!-- Add more quiz elements here -->
     
<div class="container d-flex justify-content-center" id="question-2">
    <div class="card my-4 p-4 question-block" style="width: 75%;">
        <h4 class="mb-3">2. What type of game do you prefer?</h4>
        <div class="row g-2">
            <div class="col-6">
                <button class="btn btn-outline-primary w-100 answer-btn" data-answer="competitive">Sports games</button>
            </div>
            <div class="col-6">
                <button class="btn btn-outline-primary w-100 answer-btn" data-answer="casual">Simulation games</button>
            </div>
            <div class="col-6">
                <button class="btn btn-outline-primary w-100 answer-btn" data-answer="competitive">Shooting games</button>
            </div>
            <div class="col-6">
                <button class="btn btn-outline-primary w-100 answer-btn" data-answer="casual">Adventure games</button>
            </div>
        </div>
    </div>
</div>

<div class="container d-flex justify-content-center" id="question-3">
    <div class="card my-4 p-4 question-block" style="width: 75%;">
        <h4 class="mb-3">3. How do you like to play video games?</h4>
        <div class="row g-2">
            <div class="col-6">
                <button class="btn btn-outline-primary w-100 answer-btn" data-answer="competitive">Online against other players</button>
            </div>
            <div class="col-6">
                <button class="btn btn-outline-primary w-100 answer-btn" data-answer="casual">By myself at my own pace</button>
            </div>
            <div class="col-6">
                <button class="btn btn-outline-primary w-100 answer-btn" data-answer="competitive">Playing ranked matches</button>
            </div>
            <div class="col-6">
                <button class="btn btn-outline-primary w-100 answer-btn" data-answer="casual">Exploring open-world games</button>
            </div>
        </div>
    </div>
</div>

<div class="container d-flex justify-content-center" id="question-4">
    <div class="card my-4 p-4 question-block" style="width: 75%;">
        <h4 class="mb-3">4. What is your main goal when gaming?</h4>
        <div class="row g-2">
            <div class="col-6">
                <button class="btn btn-outline-primary w-100 answer-btn" data-answer="competitive">Winning every game</button>
            </div>
            <div class="col-6">
                <button class="btn btn-outline-primary w-100 answer-btn" data-answer="casual">Having fun and relaxing</button>
            </div>
            <div class="col-6">
                <button class="btn btn-outline-primary w-100 answer-btn" data-answer="competitive">Being the best player</button>
            </div>
            <div class="col-6">
                <button class="btn btn-outline-primary w-100 answer-btn" data-answer="casual">Being creative and exploring</button>
            </div>
        </div>
    </div>
</div>




    <div class="container d-flex justify-content-center">
      <button id="show-result" class="btn btn-success my-4">Show Results</button>
    </div>    
    <!-- Output the result here -->
    <div class="container d-flex justify-content-center">
      <div id="result-container" class="card p-4 mb-4" style="width: 75%; display: none;">
        <h3>Your Result:</h3>
        <p id="result-text"></p>
      </div>
    </div>
    
    <!-- Connect to your script file here -->
     <script src = "./js/script.js"></script>
</body>
</html>
